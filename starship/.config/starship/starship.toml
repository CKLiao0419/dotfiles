# starship 提示列 —— Nord，需要 Nerd Font
# 沒有圖示的終端（Linux TTY）會改讀同資料夾的 tty.toml，見 fish/conf.d/20-tools.fish
"$schema" = 'https://starship.rs/config-schema.json'

palette = "nord"
add_newline = true

# 第一行：系統圖示 使用者@主機（只在 SSH 時顯示） 路徑 git 語言 執行時間
# 第二行：輸入游標
format = """
$os$username$hostname$directory$git_branch$git_state$git_status\
$python$nodejs$rust$golang$lua\
$cmd_duration$jobs$status
$character"""

[palettes.nord]
nord0 = "#2E3440"
nord1 = "#3B4252"
nord2 = "#434C5E"
nord3 = "#4C566A"
comment = "#616E88"
nord4 = "#D8DEE9"
nord6 = "#ECEFF4"
nord7 = "#8FBCBB"
nord8 = "#88C0D0"
nord9 = "#81A1C1"
nord10 = "#5E81AC"
nord11 = "#BF616A"
nord12 = "#D08770"
nord13 = "#EBCB8B"
nord14 = "#A3BE8C"
nord15 = "#B48EAD"

[os]
disabled = false
style = "nord9"
format = "[$symbol]($style) "

[os.symbols]
Macos = "\uf179"
Linux = "\uf17c"
Arch = "󰣇"
Debian = "\uf306"
Ubuntu = "\uf31b"
Void = "\uf32e"
Alpine = "\uf300"
Gentoo = "\uf30d"
NixOS = "\uf313"
Fedora = "\uf30a"

[username]
style_user = "nord15"
style_root = "bold nord11"
format = "[$user]($style)"

[hostname]
ssh_only = true          # 撿一堆 ThinkPad 互相 SSH 時，靠這個分辨你在哪台
style = "nord15"
format = "[@$hostname]($style) "

[directory]
style = "bold nord8"
read_only = " 󰌾"
read_only_style = "nord11"
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "…/"

[git_branch]
symbol = "\ue0a0 "
style = "nord14"
format = "[on](comment) [$symbol$branch]($style) "

[git_status]
style = "nord13"
format = "([$all_status$ahead_behind]($style) )"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"

[git_state]
style = "nord12"

[python]
symbol = "\ue73c "
style = "nord13"
format = "[$symbol$pyenv_prefix($version )(\\($virtualenv\\) )]($style)"

[nodejs]
symbol = "\ue718 "
style = "nord14"
format = "[$symbol($version )]($style)"

[rust]
symbol = "\ue7a8 "
style = "nord12"
format = "[$symbol($version )]($style)"

[golang]
symbol = "\ue627 "
style = "nord8"
format = "[$symbol($version )]($style)"

[lua]
symbol = "\ue620 "
style = "nord10"
format = "[$symbol($version )]($style)"

[cmd_duration]
min_time = 2000
style = "comment"
format = "[󱦟 $duration]($style) "

[jobs]
symbol = "\uf013"
style = "nord13"

[status]
disabled = false
symbol = "✘ "
style = "nord11"
format = "[$symbol$status]($style) "

[character]
success_symbol = "[❯](bold nord14)"
error_symbol = "[❯](bold nord11)"
vimcmd_symbol = "[❮](bold nord8)"

# kitty —— Mac 與 X220i 這類有 OpenGL 3.3 的機器用
# R50e / X61 / eeePC 的顯卡跑不動 kitty，在那些機器上改用 st / foot / xterm
# 機器專屬設定（字體大小、字體名稱）放 local.conf，不進 git

# ---------- 字體 ----------
font_family      JetBrains Maple Mono
font_size        18
# kitty 0.36 起內建 Nerd Font 圖示，字體本身沒有圖示也能顯示

# ---------- 外觀 ----------
include nord.conf
window_padding_width 5
# 標題列：no = 顯示（可拖曳、有紅黃綠按鈕）；yes = 全部隱藏；titlebar-only = 只藏標題列
hide_window_decorations no
# macOS 標題列染成跟背景一樣的 Nord 色，看起來是一體的
macos_titlebar_color background
macos_show_window_title_in window

# 透明度：預設不透明。想要半透明 / 毛玻璃就在 local.conf 寫：
#   background_opacity 0.85
#   background_blur 20          （macOS 和部分 Linux 合成器有效）
# dynamic 開著的話，可以用 cmd+shift+a 再按 m / l 即時調整
background_opacity 1.0
dynamic_background_opacity yes
cursor_shape block
cursor_trail 1
shell_integration no-cursor
remember_window_size yes
confirm_os_window_close 0

# 分頁列也配 Nord
tab_bar_style powerline
tab_powerline_style slanted

# ---------- 行為 ----------
shell fish
enabled_layouts grid
# 讓 tmux 裡的 nvim/OSC52 可以寫入系統剪貼簿
clipboard_control write-clipboard write-primary read-clipboard-ask

# ---------- 按鍵 ----------
map cmd+left  neighboring_window left
map cmd+down  neighboring_window down
map cmd+up    neighboring_window up
map cmd+right neighboring_window right
# Linux 上沒有 cmd，用 ctrl+shift+方向鍵
map ctrl+shift+left  neighboring_window left
map ctrl+shift+right neighboring_window right

# ---------- macOS 專屬（在 Linux 會被忽略）----------
macos_option_as_alt yes
macos_quit_when_last_window_closed yes

# ---------- 機器專屬 ----------
globinclude local*.conf

# lazygit —— Nord
# macOS 上 lazygit 預設讀 ~/Library/Application Support/lazygit，
# 我們在 fish 裡設了 XDG_CONFIG_HOME=~/.config，所以會改讀這裡。
gui:
  nerdFontsVersion: "3"
  border: rounded
  showIcons: true
  theme:
    activeBorderColor:
      - "#88C0D0"
      - bold
    inactiveBorderColor:
      - "#4C566A"
    searchingActiveBorderColor:
      - "#EBCB8B"
      - bold
    optionsTextColor:
      - "#81A1C1"
    selectedLineBgColor:
      - "#3B4252"
    cherryPickedCommitFgColor:
      - "#88C0D0"
    cherryPickedCommitBgColor:
      - "#434C5E"
    unstagedChangesColor:
      - "#BF616A"
    defaultFgColor:
      - "#D8DEE9"

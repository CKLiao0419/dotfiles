# ~/.config/tmux/tmux.conf  （tmux 3.1 起會自動讀這個位置）
# ============================================================
# 設計原則
#   1. 不用外掛管理器（TPM），單一檔案，任何機器 clone 下來就能用
#   2. prefix 維持預設 Ctrl-b，別人的機器、伺服器上手感一致
#   3. Nord 配色，狀態列不用 powerline 箭頭字元 → Linux TTY 上也不會亂碼
#   4. 機器專屬設定放 ~/.config/tmux/local.conf（不進 git），最後載入
# 重新載入：prefix + r
# ============================================================

# ---------- 終端與顏色 ----------
set -g default-terminal "tmux-256color"
# 告訴 tmux 外層終端支援 24-bit 真彩色（kitty、iTerm、foot、alacritty…）
set -as terminal-features ",xterm-kitty:RGB,xterm-256color:RGB,foot*:RGB,alacritty:RGB"
set -sg escape-time 10        # 預設 500ms，會讓 vim 按 Esc 有延遲
set -g focus-events on        # 讓 nvim 知道視窗切換（自動重讀檔案）
set -g set-clipboard on       # 複製透過 OSC 52 送到系統剪貼簿（SSH 遠端也有效）
set -g allow-passthrough on   # 讓 kitty 圖片協定之類的跳脫序列穿過 tmux

# 有 fish 就用 fish（各發行版 fish 路徑不同，所以用 command -v 判斷）
if-shell "command -v fish >/dev/null 2>&1" "set -g default-command fish"

# ---------- 基本行為 ----------
set -g mouse on
set -g history-limit 50000
set -g base-index 1           # 視窗從 1 開始編號，對齊鍵盤
setw -g pane-base-index 1
set -g renumber-windows on    # 關掉中間的視窗後自動重新編號
set -g set-titles on
set -g set-titles-string "#S / #W"
setw -g automatic-rename on
set -g display-time 1500

# ---------- 按鍵 ----------
# prefix 維持 Ctrl-b

bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf 已重新載入"

# 分割視窗：| 左右、- 上下，而且新的 pane 停在目前的資料夾
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# vim 方向鍵移動 pane；大寫 HJKL 調整大小（-r 表示可以連按）
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 5

# 快速切換上一個視窗（原本 l 的功能）
bind Tab last-window

# 複製模式用 vi 鍵：prefix + [ 進入，v 選取，y 複製
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# ---------- Nord 配色 ----------
# nord0 #2E3440  nord1 #3B4252  nord2 #434C5E  nord3 #4C566A
# nord4 #D8DEE9  nord6 #ECEFF4  nord8 #88C0D0  nord9 #81A1C1
# nord11 #BF616A nord13 #EBCB8B nord14 #A3BE8C

set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#3B4252,fg=#D8DEE9"

# 左：session 名稱。按下 prefix 時變成黃色，提醒你「下一個鍵會被 tmux 吃掉」
set -g status-left-length 30
set -g status-left "#{?client_prefix,#[bg=#EBCB8B],#[bg=#88C0D0]}#[fg=#2E3440,bold] #S #[default] "

# 右：主機名稱 + 時間。終端寬度小於 90 欄（例如 eeePC 的 800x480）就只留時間
set -g status-right-length 60
set -g status-right "#{?#{e|<:#{client_width},90},,#[fg=#D8DEE9 bg=#434C5E] #h }#[fg=#2E3440,bg=#81A1C1,bold] %H:%M "

# 視窗列表
setw -g window-status-separator ""
setw -g window-status-format "#[fg=#D8DEE9] #I #[fg=#ECEFF4]#W#{?window_zoomed_flag, [Z],} "
setw -g window-status-current-format "#[fg=#2E3440,bg=#81A1C1,bold] #I #W#{?window_zoomed_flag, [Z],} "
setw -g window-status-activity-style "fg=#EBCB8B"
setw -g monitor-activity on
set -g visual-activity off

# pane 邊框：目前的 pane 用亮青色
set -g pane-border-style "fg=#4C566A"
set -g pane-active-border-style "fg=#88C0D0"
set -g pane-border-lines single
set -g display-panes-colour "#4C566A"
set -g display-panes-active-colour "#88C0D0"

# 訊息列、選取區
set -g message-style "bg=#434C5E,fg=#ECEFF4"
set -g message-command-style "bg=#434C5E,fg=#ECEFF4"
setw -g mode-style "bg=#434C5E,fg=#ECEFF4"
setw -g clock-mode-colour "#88C0D0"

# ---------- 機器專屬設定（不進 git）----------
source-file -q ~/.config/tmux/local.conf
